name: fluvie_validate
description: "Static validation for Fluvie composition code: analyzer diagnostics plus the fluvie_lints rules, run in-process and never executing the code."
version: 0.1.10
repository: https://github.com/SimonErich/fluvie/tree/main/packages/fluvie_validate
homepage: https://github.com/SimonErich/fluvie
issue_tracker: https://github.com/SimonErich/fluvie/issues
documentation: https://docs.fluvie.dev
funding:
  - https://github.com/sponsors/SimonErich
topics:
  - video
  - analysis
  - validation
  - linter

environment:
  sdk: ^3.12.0

resolution: workspace
dependencies:
  analyzer: ">=8.0.0 <9.0.0"
  # Caret range, not an exact pin: an exact pin fails pub.dev's publish
  # dry-run (the v0.1.10 publish exited 65 on it). The engine calls
  # DartLintRule.testRun, which is @visibleForTesting, so a patch bump could
  # still move it — the rule-fires test guards against silent drift.
  custom_lint_builder: ^0.8.1
  fluvie: ^0.1.10
  fluvie_lints: ^0.1.10
dev_dependencies:
  coverage: ^1.15.1
  test: ^1.31.0
