name: fluvie_validate
description: "Static validation for Fluvie composition code: analyzer diagnostics plus the fluvie_lints rules, run in-process and never executing the code."
version: 0.1.10
repository: https://github.com/SimonErich/fluvie/tree/main/packages/fluvie_validate
homepage: https://github.com/SimonErich/fluvie
issue_tracker: https://github.com/SimonErich/fluvie/issues
topics:
  - video
  - analysis
  - validation
  - linter

environment:
  sdk: ^3.12.0

resolution: workspace
dependencies:
  analyzer: ">=8.0.0 <9.0.0"
  # Pinned exactly: the engine calls DartLintRule.testRun, which is
  # @visibleForTesting, so a minor bump could change it without a major. The
  # rule-fires test guards against silent drift.
  custom_lint_builder: 0.8.1
  fluvie: ^0.1.0
  fluvie_lints: ^0.1.0
dev_dependencies:
  coverage: ^1.15.1
  test: ^1.31.0
