# Generated by tool/sync_package_analysis.dart. Do not edit.
# Source of truth: the workspace root analysis_options.yaml.

# Strict, shared analysis config for the whole workspace.
# Per-package files include this and (for consumers) add the custom_lint plugin.
include: package:very_good_analysis/analysis_options.yaml

# One page width for the whole workspace (see CONTRIBUTING.md).
formatter:
  page_width: 100


analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # TODO/FIXME are forbidden by the pre-commit grep-gate, not the analyzer,
    # so a stray "TODO" substring never trips --fatal-infos.
    todo: ignore
    # custom_lint 0.8 uses the legacy plugin API. The separate lint gate still
    # executes every rule while its upstream migrates to the new plugin API.
    analysis_options_deprecated_plugins: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"

linter:
  rules:
    # The workspace formats at page width 100 (see `formatter:` above).
    lines_longer_than_80_chars: false
    # --- correctness / safety ---
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    only_throw_errors: true
    unawaited_futures: true
    # --- clean code / style ---
    combinators_ordering: true
    directives_ordering: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_final_in_for_each: true
    prefer_final_locals: true
    sort_pub_dependencies: true
    unnecessary_lambdas: true
    unnecessary_parenthesis: true
    use_super_parameters: true
    # --- API hygiene ---
    # Forbids importing another package's `src/` (enforces the single barrel).
    implementation_imports: true
    # Docs are mandatory only in packages/fluvie (re-enabled there).
    public_member_api_docs: false
