name: fluvie_api
description: "HTTP API that renders Fluvie videos to files (local or S3), with a web-safe client."
version: 0.1.2
repository: https://github.com/SimonErich/fluvie/tree/main/packages/fluvie_api
homepage: https://github.com/SimonErich/fluvie
issue_tracker: https://github.com/SimonErich/fluvie/issues
topics:
  - video
  - rendering
  - server
  - api

environment:
  sdk: ^3.12.0

resolution: workspace
# `crypto`, `fluvie_cli`, `minio`, and the `shelf` deps are server-only and are
# never reached by `lib/client.dart`, so the client stays web-safe; `http` and
# `meta` are shared by the client and the server.
dependencies:
  crypto: ^3.0.7
  fluvie_cli: ^0.1.0
  http: ^1.1.0
  meta: ^1.16.0
  minio: ^3.5.8
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
dev_dependencies:
  coverage: ^1.15.1
  mocktail: ^1.0.5
  test: ^1.31.0
