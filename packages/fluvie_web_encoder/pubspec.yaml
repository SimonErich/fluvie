name: fluvie_web_encoder
description: "Render Fluvie videos to MP4 fully in the browser with ffmpeg.wasm. Opt-in, so apps that only use the render API or mobile encoders stay light."
version: 0.1.8
repository: https://github.com/SimonErich/fluvie/tree/main/packages/fluvie_web_encoder
homepage: https://github.com/SimonErich/fluvie
issue_tracker: https://github.com/SimonErich/fluvie/issues
topics:
  - video
  - rendering
  - web
  - wasm

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  fluvie: ^0.1.0
  http: ^1.5.0
  meta: ^1.16.0
  web: ^1.1.0

dev_dependencies:
  custom_lint: ^0.8.1
  flutter_test:
    sdk: flutter
  fluvie_lints:
    path: ../fluvie_lints
  mocktail: ^1.0.5

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FluvieWebEncoderPlugin
        fileName: fluvie_web_encoder_web.dart
