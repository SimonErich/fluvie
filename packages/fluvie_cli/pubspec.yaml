  http: ^1.2.0
  meta: ^1.16.0
  path: ^1.9.0
  yaml: ^3.1.0
  yaml_edit: ^2.2.0
dev_dependencies:
  coverage: ^1.15.1
  mocktail: ^1.0.5
  test: ^1.31.0
