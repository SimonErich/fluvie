name: fluvie_lints
description: "custom_lint rules for the Fluvie video library: timing mistakes, determinism breaches, and the layering law."
version: 0.1.9
repository: https://github.com/SimonErich/fluvie/tree/main/packages/fluvie_lints
homepage: https://github.com/SimonErich/fluvie
issue_tracker: https://github.com/SimonErich/fluvie/issues
topics:
  - lints
  - linter
  - custom-lint
  - video

environment:
  sdk: ^3.12.0

resolution: workspace
dependencies:
  # The analyzer AST + diagnostic types every rule visits. custom_lint_builder
  # already pins it transitively; declaring it keeps the imports honest.
  analyzer: ">=8.0.0 <9.0.0"
  custom_lint_builder: ^0.8.1
dev_dependencies:
  # The change-protocol types (SourceEdit/SourceFileEdit) the fix tests apply.
  analyzer_plugin: ">=0.13.0 <0.15.0"
  coverage: ^1.15.1
  test: ^1.31.0
