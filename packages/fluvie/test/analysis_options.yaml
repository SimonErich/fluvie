# Test fixtures deliberately build invalid compositions (dangling anchors,
# relative times with no enclosing scope, conflicting keyframes, cyclic
# triggers, ...) to exercise the timing diagnostics, so the authoring lints that
# flag those are noise here. Demote them for tests only; lib/ keeps full
# enforcement, and the structural lints (layering, no_src_import,
# deprecated_member) stay on everywhere.
#
# These are custom_lint codes. dart analyze only knows them when the custom_lint
# plugin is loaded into analysis (it is on CI, where the plugin now surfaces them
# through analyze; it is not in every local run), so unrecognized_error_code is
# demoted too, otherwise the overrides would themselves be flagged off CI.
include: ../analysis_options.yaml

analyzer:
  errors:
    dangling_anchor: ignore
    relative_outside_scope: ignore
    conflicting_keyframe_fields: ignore
    cyclic_trigger: ignore
    unused_anchor: ignore
    animation_exceeds_window: ignore
    unrecognized_error_code: ignore
