# The library package: root strictness + the custom_lint plugin, and docs
# are mandatory on every public member (only here; the root disables it).
include: analysis_options.shared.yaml

# Keep the package entry point explicit; the generated include also carries this policy.
formatter:
  page_width: 100

analyzer:
  exclude:
    - build/**
  plugins:
    - custom_lint

linter:
  rules:
    public_member_api_docs: true
