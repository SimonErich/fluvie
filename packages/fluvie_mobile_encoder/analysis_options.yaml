# Root strictness + the custom_lint plugin, and docs are mandatory on every
# public member (mirrors packages/fluvie).
include: analysis_options.shared.yaml

# Keep the package entry point explicit; the generated include also carries this policy.
formatter:
  page_width: 100

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  plugins:
    - custom_lint

linter:
  rules:
    public_member_api_docs: true
