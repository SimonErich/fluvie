name: fluvie_mobile_encoder
description: "Render Fluvie videos to MP4 fully on-device on Android and iOS using the platform's native hardware encoder, with no FFmpeg and no server."
version: 0.1.7
repository: https://github.com/SimonErich/fluvie/tree/main/packages/fluvie_mobile_encoder
homepage: https://github.com/SimonErich/fluvie
issue_tracker: https://github.com/SimonErich/fluvie/issues
topics:
  - video
  - rendering
  - android
  - ios

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  fluvie: ^0.1.0
  http: ^1.5.0
  meta: ^1.16.0
  riverpod: ^3.3.2

dev_dependencies:
  custom_lint: ^0.8.1
  flutter_test:
    sdk: flutter
  fluvie_lints:
    path: ../fluvie_lints
  mocktail: ^1.0.5

flutter:
  plugin:
    platforms:
      android:
        package: dev.fluvie.mobile_encoder
        pluginClass: FluvieMobileEncoderPlugin
      ios:
        pluginClass: FluvieMobileEncoderPlugin
