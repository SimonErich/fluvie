<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="slides">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>slides</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The FluvieFfmpeg bridge: the page-global object fluvie's in-browser
    encoder drives (load / writeFile / exec / readFile), wrapping
    @ffmpeg/ffmpeg loaded as ESM with the single-threaded core (no
    cross-origin-isolation headers needed). Vendor the wasm files with
    tool/fetch_ffmpeg.sh before serving; without this script the export
    menu's video entry stays disabled and says what is missing.
  -->
  <script type="importmap">
    {
      "imports": {
        "@ffmpeg/ffmpeg": "./ffmpeg/ffmpeg/index.js",
        "@ffmpeg/util": "./ffmpeg/util/index.js"
      }
    }
  </script>
  <script type="module">
    import { FFmpeg } from '@ffmpeg/ffmpeg';

    async function toBlobURL(url, type) {
      const buffer = await (await fetch(url)).arrayBuffer();
      return URL.createObjectURL(new Blob([buffer], { type }));
    }

    const ffmpeg = new FFmpeg();
    let loaded = null;
    async function loadFfmpeg() {
      await ffmpeg.load({
        coreURL: await toBlobURL('./ffmpeg/core/ffmpeg-core.js', 'text/javascript'),
        wasmURL: await toBlobURL('./ffmpeg/core/ffmpeg-core.wasm', 'application/wasm'),
      });
    }

    globalThis.FluvieFfmpeg = {
      load: () => (loaded ??= loadFfmpeg()),
      writeFile: (name, bytes) => ffmpeg.writeFile(name, bytes),
      exec: (args) => ffmpeg.exec(args),
      readFile: (name) => ffmpeg.readFile(name),
      deleteFile: (name) => ffmpeg.deleteFile(name),
      terminate: async () => { ffmpeg.terminate(); loaded = null; },
    };
  </script>
  <script type="module" src="clip_decoder.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
