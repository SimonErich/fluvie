<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Create and edit Fluvie videos in your browser.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fluvie Editor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fluvie Editor</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The FluvieFfmpeg bridge: the page-global object fluvie's in-browser
    encoder drives (load / writeFile / exec / readFile), wrapping
    @ffmpeg/ffmpeg loaded as ESM with the single-threaded core (no
    cross-origin-isolation headers needed). Vendor the wasm files with
    tool/fetch_ffmpeg.sh before serving; without this script the export
    menu's video entry stays disabled and says what is missing.
  -->
  <script type="importmap">
    {
      "imports": {
        "@ffmpeg/ffmpeg": "./ffmpeg/ffmpeg/index.js",
        "@ffmpeg/util": "./ffmpeg/util/index.js"
      }
    }
  </script>
  <script type="module">
    import { FFmpeg } from '@ffmpeg/ffmpeg';

    async function toBlobURL(url, type) {
      const buffer = await (await fetch(url)).arrayBuffer();
      return URL.createObjectURL(new Blob([buffer], { type }));
    }

    const ffmpeg = new FFmpeg();
    let loaded = null;
    async function loadFfmpeg() {
      await ffmpeg.load({
        coreURL: await toBlobURL('./ffmpeg/core/ffmpeg-core.js', 'text/javascript'),
        wasmURL: await toBlobURL('./ffmpeg/core/ffmpeg-core.wasm', 'application/wasm'),
      });
    }

    globalThis.FluvieFfmpeg = {
      load: () => (loaded ??= loadFfmpeg()),
      writeFile: (name, bytes) => ffmpeg.writeFile(name, bytes),
      exec: (args) => ffmpeg.exec(args),
      readFile: (name) => ffmpeg.readFile(name),
      deleteFile: (name) => ffmpeg.deleteFile(name),
      terminate: async () => { ffmpeg.terminate(); loaded = null; },
    };
  </script>
  <script type="module" src="clip_decoder.js"></script>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="loading-mark" aria-hidden="true"></div>
    <p>Loading Fluvie Editor…</p>
  </div>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #090a0d; }
    #app-loading {
      position: fixed; inset: 0; z-index: 10; display: grid; align-content: center;
      justify-items: center; gap: 16px; color: #e6e8ee;
      font: 500 15px/1.4 system-ui, sans-serif; transition: opacity 180ms ease;
    }
    #app-loading p { margin: 0; }
    .loading-mark {
      width: 34px; height: 34px; border: 3px solid #333741; border-top-color: #35eaa4;
      border-radius: 50%; animation: loading-spin 800ms linear infinite;
    }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .loading-mark { animation-duration: 1800ms; }
      #app-loading { transition: none; }
    }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('app-loading');
      if (!loading) return;
      loading.style.opacity = '0';
      window.setTimeout(function () { loading.remove(); }, 200);
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
