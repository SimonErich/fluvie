name: slides
description: "The deployable Fluvie presenter shell: open a .fluvie file (or a bundled example) and present it — slides.fluvie.dev."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  archive: ^4.0.0
  # Flutter's adaptive controls remain in the UI dependency's release kernel.
  # Bundle their icon font as well as the app's Lucide icons.
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  fluvie: ^0.3.1
  fluvie_cli: ^0.3.1
  fluvie_editor: ^0.3.1
  fluvie_presenter: ^0.3.1
  fluvie_web_encoder: ^0.3.1
  obers_ui:
    git:
      url: https://github.com/SimonErich/obers_ui.git
      ref: 990286c9ac4cebe74ee36ece6fac82c2599896c1
  pdf: ^3.12.0
  web: ^1.1.1

dev_dependencies:
  alchemist: ^0.14.0
  custom_lint: ^0.8.1
  flutter_test:
    sdk: flutter
  fluvie_lints:
    # A path (not hosted) constraint: the custom_lint plugin host replicates
    # this dependency and must resolve it without pub.dev.
    path: ../../packages/fluvie_lints
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
