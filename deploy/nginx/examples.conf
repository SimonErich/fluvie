# nginx config for the Fluvie example web apps: the in-browser meme maker at the
# root and the server-render studio under /server/, each with SPA fallback.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Entry points sit at stable URLs, so revalidate them on every load.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /server/index.html { add_header Cache-Control "no-cache"; }
  location = /flutter_bootstrap.js { add_header Cache-Control "no-cache"; }

  # Content-hashed build assets (and the vendored ffmpeg.wasm) cache long.
  location ~* \.(js|wasm|json|css|png|jpg|jpeg|gif|svg|woff2|ttf|mp4|webm)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  # The server-render studio is a separate SPA under /server/.
  location /server/ {
    try_files $uri $uri/ /server/index.html;
  }

  # The in-browser meme maker is the root SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
