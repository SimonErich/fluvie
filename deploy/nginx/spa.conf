# nginx config for the Flutter web demo: single-page fallback plus cached assets.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The Flutter web entry points sit at stable, non-hashed URLs, so they must be
  # revalidated on every load. Caching them (the asset regex below would) pins a
  # returning visitor to the previous build until the cache expires, so a
  # redeploy is invisible. An exact-match location outranks the regex below.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /flutter_bootstrap.js { add_header Cache-Control "no-cache"; }
  location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
  location = /main.dart.js { add_header Cache-Control "no-cache"; }
  location = /version.json { add_header Cache-Control "no-cache"; }

  # Long-lived caching for the build assets (they are content-hashed) and the
  # pre-rendered /media/<key>.mp4 lesson videos baked into the image.
  location ~* \.(js|wasm|json|css|png|jpg|jpeg|gif|svg|woff2|ttf|mp4|webm)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  # Client-side routing: unknown paths fall back to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
