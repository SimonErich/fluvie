# nginx config for the Flutter web demo: single-page fallback plus cached assets.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routing: unknown paths fall back to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-lived caching for the build assets (they are content-hashed).
  location ~* \.(js|wasm|json|css|png|jpg|jpeg|gif|svg|woff2|ttf)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
