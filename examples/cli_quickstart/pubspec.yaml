name: cli_quickstart
description: "Kitten Mitten CLI quickstart: a tiny project you render to an MP4 with the fluvie CLI."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  fluvie: ^0.3.1
  kitten_kit:
    path: ../kitten_kit

dev_dependencies:
  alchemist: ^0.14.0
  custom_lint: ^0.8.1
  flutter_test:
    sdk: flutter
  fluvie_cli: ^0.3.1
  fluvie_lints:
    path: ../../packages/fluvie_lints
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
