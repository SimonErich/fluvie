name: desktop_studio
description: "Kitten Mitten desktop studio: render kitten promos to MP4 locally via the Fluvie CLI."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  file_selector: ^1.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  fluvie: ^0.3.0
  kitten_kit:
    path: ../kitten_kit

dev_dependencies:
  alchemist: ^0.14.0
  custom_lint: ^0.8.1
  flutter_test:
    sdk: flutter
  fluvie_cli: ^0.3.0
  fluvie_lints:
    path: ../../packages/fluvie_lints
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
