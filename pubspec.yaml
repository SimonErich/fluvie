name: fluvie_workspace
description: Melos + pub workspace root for the Fluvie video-rendering library.
publish_to: none

environment:
  sdk: ^3.12.0

# Native pub workspace (Dart 3.6+). Melos 7 orchestrates scripts on top of this.
workspace:
  - packages/fluvie
  - packages/fluvie_lints
  - packages/fluvie_lints/example
  - packages/fluvie_cli
  - packages/fluvie_media
  - packages/fluvie_ai
  - packages/fluvie_validate
  - packages/fluvie_server
  - packages/fluvie_render_client
  - packages/fluvie_mobile_encoder
  - packages/fluvie_editor
  - packages/fluvie_presenter
  - packages/fluvie_web_encoder
  - packages/fluvie_web_encoder/example
  - apps/slides
  - examples/gallery
  - examples/kitten_kit
  - examples/cli_quickstart
  - examples/web_browser_studio
  - examples/web_server_studio
  - examples/desktop_studio
  - examples/mobile_purrfect

dev_dependencies:
  melos: ^7.0.0
  test: ^1.31.0
  very_good_analysis: ^10.2.0
  yaml: ^3.1.3

# Melos 7 reads its config from this `melos:` key when the root is a pub workspace.
melos:
  name: fluvie

  command:
    bootstrap:
      runPubGetInParallel: false

  scripts:
    analyze:
      description: Static analysis across the workspace; infos & warnings are fatal.
      steps:
        - analyze:policy
        - analyze:packages
        - analyze:tool

    analyze:policy:
      description: Verify publishable packages carry the exact workspace analysis policy.
      run: dart tool/workspace_inventory.dart --check && dart tool/sync_package_analysis.dart --check

    analyze:packages:
      description: >
        Analyze each package in its own process. One `dart analyze .` over the
        whole workspace analyzed every package in a single process, which grew
        with the workspace until CI's runner was killed part way through it. The
        coverage is the same; only the peak per process changes.
      # Analyzer subprocesses must not attempt telemetry in offline/headless CI.
      run: dart --suppress-analytics analyze --fatal-infos --fatal-warnings .
      exec:
        concurrency: 1

    analyze:tool:
      description: >
        Analyze the root `tool/` scripts, which belong to no package and so are
        not reached by analyze:packages.
      run: dart --suppress-analytics analyze --fatal-infos --fatal-warnings tool

    format:
      description: Verify formatting (CI). Use `melos run format:fix` to apply.
      # Published benchmark downloads retain their original recorded bytes.
      # Format workspace source roots, not web/public evidence or build output.
      run: dart format --output=none --set-exit-if-changed apps examples packages tool

    format:fix:
      description: Apply formatting across the workspace.
      run: dart format apps examples packages tool

    lint:
      description: Run fluvie_lints via custom_lint in every consuming package.
      run: dart run custom_lint
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: custom_lint

    test:dart:
      description: Run pure-Dart package tests (ffmpeg/download/render/analysis opt-in).
      run: dart test --exclude-tags "ffmpeg || download || render || analysis || generative"
      exec:
        concurrency: 1
      packageFilters:
        flutter: false
        dirExists: test

    test:flutter:
      description: Run Flutter package tests (golden/snapshot/ffmpeg/wasm/render/e2e tests opt-in).
      run: flutter test --exclude-tags "golden || snapshot || ffmpeg || wasm || render || generative || e2e"
      exec:
        concurrency: 1
      packageFilters:
        flutter: true
        dirExists: test

    test:ffmpeg:
      description: >
        Run the ffmpeg-tagged integration suites (real ffmpeg >= 6.0 and
        ffprobe on PATH; the CLI e2e additionally needs a Flutter SDK).
      steps:
        - test:ffmpeg:flutter
        - test:ffmpeg:dart

    test:ffmpeg:flutter:
      description: Real encoding and native slides audition (dummy SDL output for headless runners).
      run: SDL_AUDIODRIVER=dummy flutter test --tags ffmpeg
      exec:
        concurrency: 1
      packageFilters:
        scope:
          - fluvie
          - slides

    test:ffmpeg:dart:
      description: ffmpeg-tagged suites in fluvie_cli (the render e2e).
      run: dart test --tags ffmpeg
      exec:
        concurrency: 1
      packageFilters:
        scope: fluvie_cli

    test:download:
      description: >
        Download-tagged suites: fetch the real pinned FFmpeg build over the
        network and prove it installs and runs. Needs internet access.
      run: dart test --tags download
      exec:
        concurrency: 1
      packageFilters:
        scope: fluvie_cli

    test:goldens:
      description: Run the opt-in pixel-golden tests (Alchemist; baselines pinned to Linux).
      run: flutter test --tags golden
      exec:
        concurrency: 1
      packageFilters:
        # Only packages that actually own golden tests. `flutter test --tags
        # golden` exits non-zero with "No tests match the requested tag
        # selectors" in a package that has none, which fails the whole script.
        # Add a package here in the same change that gives it its first golden.
        scope:
          - fluvie
          - fluvie_presenter
          - kitten_kit
          - slides

    test:e2e:
      description: End-to-end integration tests on the Linux desktop (needs a display).
      run: flutter test integration_test -d linux
      exec:
        concurrency: 1
      packageFilters:
        scope: slides

    test:
      description: Run all package tests (Dart then Flutter).
      steps:
        - test:dart
        - test:flutter

    coverage:
      description: Run all package tests with coverage (Flutter, pure Dart, root tool).
      steps:
        - coverage:flutter
        - coverage:dart
        - test:tool

    coverage:flutter:
      description: >
        Flutter package tests with coverage (ffmpeg/wasm integration excluded
        so the gate never needs the binaries; their logic is covered by the
        mocked unit suites).
      run: dart "$MELOS_ROOT_PATH/tool/run_flutter_suite.dart" --coverage --exclude-tags "ffmpeg || wasm || render || generative || e2e"
      exec:
        concurrency: 1
      packageFilters:
        flutter: true
        dirExists: test

    coverage:dart:
      description: Pure-Dart package tests with lcov coverage (ffmpeg/download/render/analysis e2e excluded).
      run: dart "$MELOS_ROOT_PATH/tool/run_dart_suite.dart"
      exec:
        concurrency: 1
      packageFilters:
        flutter: false
        dirExists: test

    coverage:check:
      description: The coverage gate — fails under 97% on source-derived production package and app targets.
      steps:
        - coverage
        - coverage:gate

    coverage:gate:
      description: >
        Evaluate lcov reports against the 97% threshold (generated files
        excluded, // coverage:ignore markers honored — see
        documentation/contributing/coverage.md).
      run: dart tool/check_coverage.dart --min 97 --workspace

    test:tool:
      description: Root tool tests (coverage gate parser).
      run: dart test tool

    docs:
      description: Generate the API techspec for fluvie (needs Flutter >= 3.44).
      run: dart doc --output doc/api
      exec:
        concurrency: 1
      packageFilters:
        scope: fluvie

    docs:snippets:
      description: >
        Populate every documentation code fence from its compiled
        `// #docregion` source (see documentation/README.md); covers the
        root docs and the presenter package docs.
      run: >
        dart run tool/docs/sync_snippets.dart &&
        (cd packages/fluvie_presenter && dart run ../../tool/docs/sync_snippets.dart) &&
        node tool/docs/sync_reference.mjs --export-interfaces

    docs:snippets:check:
      description: >
        Fail if any documentation code fence has drifted from its source
        (CI and the fresh-clone run; changes nothing).
      run: >
        node tool/docs/sync_reference.mjs --export-interfaces --check &&
        dart run tool/docs/sync_snippets.dart --check &&
        (cd packages/fluvie_presenter && dart run ../../tool/docs/sync_snippets.dart --check)

    docs:lint:
      description: >
        Fail if any ```dart fence under documentation/ lacks a preceding
        code-excerpt directive (the naked-fence gate; mirrors the pre-commit
        hook over the whole tree).
      run: >
        bash tool/docs/check_naked_fences.sh documentation &&
        bash tool/docs/check_naked_fences.sh packages/fluvie_presenter/documentation

    docs:dartdoc:
      description: >
        Run `dart doc` on source-derived production library packages, failing on any warning (validates links).
        Used by CI and the fresh-clone script, not the fast pre-commit gate.
      run: bash tool/docs/check_dartdoc.sh

    gate:
      description: Full per-epic quality gate — must be green before every commit.
      steps:
        - format
        - analyze
        - lint
        - coverage:check

    version:
      description: >
        Set every package to one version for a lockstep release, then update the
        CHANGELOGs and create the GitHub Release for that tag. Call the script
        with the version: `bash tool/set_version.sh 0.1.2`.
      run: bash tool/set_version.sh

    render:examples:
      description: >
        Render every registered composition to build/<key>.mp4 via the
        two-process CLI (capture with `flutter test`, then encode). Needs a
        Flutter SDK and ffmpeg on PATH; intentionally not part of `gate`. The
        key list is static; add a key here when you register a new composition.
      run: |
        mkdir -p build
        for key in demo multi_scene days_recap 01_hello_video 02_text_and_motion 03_timing_and_triggers 04_scenes_and_transitions 05_images_and_clips 06_collage 07_charts 08_code_doc_intro 09_diagrams_and_webviews 10_audio_and_captions 11_templates_and_aspects 12_the_kitchen_sink; do
          echo "Rendering $key…"
          dart run packages/fluvie_cli/bin/fluvie.dart render "$key" --out "build/$key.mp4" || exit 1
        done

    web:gallery:
      description: >
        Regenerate the optional landing-page example gallery clips: render each
        lesson to build/<key>.mp4 with Impeller, then encode
        web/site/public/media/<key>.{mp4,webm,poster.webp,gif}. Needs a Flutter SDK
        and ffmpeg on PATH (not part of `gate`). Pass `--encode-only` to re-encode
        existing build/*.mp4 (ffmpeg only). The Astro gallery shows gradient posters
        by default; wire clips in per web/site/MAINTAINING.md.
      run: bash tool/web/regenerate_gallery.sh

    web:smoke:
      description: >
        Build the demo web app, serve it, and smoke-test it in headless Chrome
        (it boots, lays out, and logs no uncaught error). Needs node, python3, and
        a Chrome binary (set CHROME). Set SKIP_BUILD=1 to reuse an existing build.
      run: bash examples/gallery/tool/screenshots/run.sh
