name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.2"

# melos run scripts re-invoke `melos` for their exec/steps stages, so melos must
# be on PATH (a plain `dart run melos` is not enough). Each job activates it and
# adds the pub-cache bin to PATH.

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Set up melos
        shell: bash
        run: |
          dart pub global activate melos
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      - run: melos run format
      - run: melos run analyze
      - run: melos run lint --no-select

  test:
    strategy:
      matrix:
        # Linux is the determinism baseline; macOS gives a second Unix target.
        # The lint and timing test harnesses are Unix-only. This matrix does
        # not establish Windows runtime or rendering acceptance.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Set up melos
        shell: bash
        run: |
          dart pub global activate melos
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      - run: melos run test
      - run: melos run test:tool
      # Platform goldens are Linux-baselined; ci-variant goldens run everywhere
      # through the coverage job below.
      - if: runner.os == 'Linux'
        run: melos run test:goldens

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Set up melos
        shell: bash
        run: |
          dart pub global activate melos
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      - name: Provision the paired native tools for media coverage
        shell: bash
        run: |
          dart --packages=.dart_tool/package_config.json packages/fluvie_cli/bin/fluvie.dart ffmpeg install
          fluvie_test_ffmpeg="$(dart --packages=.dart_tool/package_config.json packages/fluvie_cli/bin/fluvie.dart ffmpeg path)"
          fluvie_test_ffprobe="${fluvie_test_ffmpeg%/*}/ffprobe"
          test -x "$fluvie_test_ffmpeg"
          test -x "$fluvie_test_ffprobe"
          {
            printf 'FLUVIE_FFMPEG=%s\n' "$fluvie_test_ffmpeg"
            printf 'FLUVIE_FFPROBE=%s\n' "$fluvie_test_ffprobe"
            printf 'FLUVIE_TEST_NATIVE_MEDIA=1\n'
          } >> "$GITHUB_ENV"
      - run: melos run coverage:check
      - name: Derive coverage uploads from the workspace
        id: coverage_inventory
        run: echo "files=$(dart tool/workspace_inventory.dart --coverage-files)" >> "$GITHUB_OUTPUT"
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage_inventory.outputs.files }}
        continue-on-error: true

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/docs/package-lock.json
            web/site/package-lock.json
      - name: Set up melos
        shell: bash
        run: |
          dart pub global activate melos
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      # Docs snippets must match their compiled sources, and every dart fence
      # must carry a code-excerpt directive.
      - run: node --test tool/docs/*.test.mjs tool/benchmarks/*.test.mjs
      - run: python3 tool/docs/check_site_links_test.py
      - run: node tool/docs/sync_reference.mjs --export-interfaces --check
      - run: melos run docs:snippets:check
      - run: melos run docs:lint
      - run: melos run docs:dartdoc
      - name: Build the documentation site
        working-directory: web/docs
        run: |
          npm ci
          npm run build
          npm run check
      - name: Build and check the marketing site
        working-directory: web/site
        run: |
          npm ci
          npm run build
          npm run check
          python3 ../../tool/docs/check_site_links.py dist --docs-root ../docs/dist

  pana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: bash tool/verify_packages.sh "$FLUTTER_ROOT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-publishability
          path: build/pana/

  smoke_render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install the system pair; the render smoke checks the supported version floor.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Set up melos
        shell: bash
        run: |
          dart pub global activate melos
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      # End-to-end render smoke: capture with flutter test, encode with
      # ffmpeg, all through the real CLI.
      - run: dart run packages/fluvie_cli/bin/fluvie.dart render demo --out build/demo.mp4
      - run: test -s build/demo.mp4
      # The exhaustive 12-lesson render-smoke. Each gallery lesson is
      # captured -> encoded -> ffprobed through the production capture shell +
      # manifest + ffmpeg arg array, asserting the encoded video frame count
      # equals the lesson's video.totalFrames. ffmpeg-tagged, so it is excluded
      # from the default `melos run test`; this job opts it in.
      - run: flutter test --tags ffmpeg test/render/lessons_render_smoke_test.dart
        working-directory: examples/gallery

  # Compiles the in-browser example to JS. dart2js fails on any live `dart:io`
  # reference, so this guards the web encoder (and the fluvie barrel it imports)
  # against a regression that pulls `dart:io` into the web render path. No
  # ffmpeg.wasm is needed: the core loads at runtime, not at build time.
  web_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Set up melos
        shell: bash
        run: |
          dart pub global activate melos
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      - run: flutter build web
        working-directory: packages/fluvie_web_encoder/example
      # The presenter's deployable shell must keep building for the web (its
      # primary just-visit-and-present path).
      - run: flutter build web --release
        working-directory: apps/slides

  # Real shipped media bridges and compiled editor in three browser engines.
  # Linux WebKit coverage does not replace Safari acceptance on Apple devices.
  editor_browser_matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: browser-actions/setup-chrome@v2
        id: browser-chrome
      - run: flutter pub get
      - run: bash apps/slides/tool/fetch_ffmpeg.sh
      - run: flutter build web --release
        working-directory: apps/slides
      - name: Verify every referenced icon glyph in the release bundle
        run: |
          python3 -m venv "$RUNNER_TEMP/fluvie-font-check"
          "$RUNNER_TEMP/fluvie-font-check/bin/pip" install -r tool/requirements-font-validation.txt
          PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/fluvie-font-check/bin/python" -m unittest discover -s tool -p test_verify_icon_fonts.py
          "$RUNNER_TEMP/fluvie-font-check/bin/python" tool/verify_icon_fonts.py \
            --app apps/slides --flutter-root "$FLUTTER_ROOT" \
            --report build/release-hardening/browsers/icon-fonts.json
      - run: node --test tool/test/browser*_test.mjs
      - run: bash tool/verify_browser_matrix.sh --with-deps
        env:
          CHROME_EXECUTABLE: ${{ steps.browser-chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-browser-matrix
          path: build/release-hardening/browsers/

  # Smoke-tests the demo web app (examples/gallery/) in headless Chrome: it builds, serves,
  # boots, lays out, and logs no uncaught error. Guards the web demo against build
  # and runtime regressions. Deterministic: no API or server is needed.
  web_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - name: Set up melos
        shell: bash
        run: |
          dart pub global activate melos
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      - name: Smoke-test the demo web app
        env:
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: melos run web:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke-screenshot
          path: examples/gallery/tool/screenshots/smoke.png
          if-no-files-found: ignore

  # Optional integration lane: the ffmpeg-tagged suites against the real
  # binaries. Advisory only; native media coverage above uses the managed pair.
  ffmpeg_integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Set up melos
        shell: bash
        run: |
          dart pub global activate melos
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      - run: melos run test:ffmpeg

  # ===========================================================================
  # Example apps (examples/): build + real-render e2e, one per rendering path.
  # The build and CLI-render jobs are required; the heavier GUI/wasm/emulator
  # render jobs are advisory until their runners are proven, then promote them.
  # ===========================================================================

  # CLI render path: render the quickstart kitten promo through the real CLI and
  # ffprobe the MP4. The most reliable example render.
  example_cli_render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Set up melos
        shell: bash
        run: |
          dart pub global activate melos
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      - name: Render the quickstart promo via the CLI
        working-directory: examples/cli_quickstart
        run: dart run fluvie_cli:fluvie render whisker_standup --out build/whisker.mp4 --frames 24
      - name: Assert the MP4 is a valid H.264 video
        run: |
          test -s examples/cli_quickstart/build/whisker.mp4
          codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 examples/cli_quickstart/build/whisker.mp4)
          test "$codec" = "h264"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-cli-quickstart-mp4
          path: examples/cli_quickstart/build/whisker.mp4
          if-no-files-found: ignore

  # Build the web example apps for the browser (guards the web render path
  # against dart:io leaks and verifies the conditional render seams compile).
  example_web_builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Set up melos
        shell: bash
        run: |
          dart pub global activate melos
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      - name: Vendor ffmpeg.wasm for the in-browser app
        run: bash examples/web_browser_studio/tool/fetch_ffmpeg.sh
      - run: flutter build web --release
        working-directory: examples/web_browser_studio
      - run: flutter build web --release
        working-directory: examples/web_server_studio
      - uses: actions/upload-artifact@v4
        with:
          name: example-web-browser-studio
          path: examples/web_browser_studio/build/web
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: example-web-server-studio
          path: examples/web_server_studio/build/web
          if-no-files-found: error

  # Build the Linux desktop example.
  example_desktop_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Set up melos
        shell: bash
        run: |
          dart pub global activate melos
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release
        working-directory: examples/desktop_studio
      - uses: actions/upload-artifact@v4
        with:
          name: example-desktop-studio-linux
          path: examples/desktop_studio/build/linux/x64/release/bundle
          if-no-files-found: error

  # Build the Android on-device example (APK).
  example_mobile_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Set up melos
        shell: bash
        run: |
          dart pub global activate melos
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      - run: flutter build apk --debug
        working-directory: examples/mobile_purrfect
      - uses: actions/upload-artifact@v4
        with:
          name: example-mobile-purrfect-apk
          path: examples/mobile_purrfect/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # Real AVFoundation clip probe/extraction and encode coverage, including
  # presentation-order/VFR/rotation fixtures and independently decoded output.
  # This is a native simulator gate; physical-device throughput remains separate.
  example_ios_media:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Create the disposable iOS example host
        working-directory: examples/mobile_purrfect
        run: flutter create --platforms=ios --org dev.fluvie --project-name mobile_purrfect --no-pub .
      - name: Compile the production iOS app and native plugin
        working-directory: examples/mobile_purrfect
        run: flutter build ios --simulator --debug --no-codesign --no-pub
      - name: Boot an installed iPhone simulator
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          phones = [d for group in devices['devices'].values() for d in group
                    if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not phones:
              raise RuntimeError('No installed iPhone simulator runtime')
          device = next((d for d in phones if d['state'] == 'Booted'), phones[0])
          if device['state'] != 'Booted':
              subprocess.run(['xcrun', 'simctl', 'boot', device['udid']], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', device['udid'], '-b'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SIMULATOR_UDID=' + device['udid'] + '\n')
          PY
      - name: Decode exact source frames on iOS
        working-directory: examples/mobile_purrfect
        run: flutter test --no-pub --no-uninstall -d "$SIMULATOR_UDID" integration_test/native_clip_reader_test.dart
      - name: Render and re-import clips with native audio
        working-directory: examples/mobile_purrfect
        run: flutter test --no-pub --no-uninstall -d "$SIMULATOR_UDID" integration_test/native_media_acceptance_test.dart
      - name: Independently verify retained iOS media
        working-directory: examples/mobile_purrfect
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          bundle_id=$(plutil -extract CFBundleIdentifier raw -o - build/ios/iphonesimulator/Runner.app/Info.plist)
          python3 tool/verify_ios_media.py --device "$SIMULATOR_UDID" --bundle-id "$bundle_id" \
            --output ../../build/release-hardening/ios-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-media-acceptance
          path: build/release-hardening/ios-artifacts/
          if-no-files-found: ignore

  # Advisory: render fully in the browser with ffmpeg.wasm and assert the marker.
  example_web_browser_render:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - name: Set up melos
        shell: bash
        run: |
          dart pub global activate melos
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      - run: bash examples/web_browser_studio/tool/fetch_ffmpeg.sh
      - run: flutter build web --release --dart-define=FLUVIE_E2E=true
        working-directory: examples/web_browser_studio
      - name: Render in the browser and assert the marker
        # WebCodecs H.264 decode needs Chrome's proprietary codecs; the
        # setup-chrome Chromium build omits them (NotSupportedError), so use the
        # runner's pre-installed Google Chrome, which the real target browsers
        # ship. Falls back to run.sh's own detection if it is somehow absent.
        env:
          BUILD_DIR: examples/web_browser_studio/build/web
        run: |
          export CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          bash tool/web/e2e/run.sh

  # Advisory: render on the server (started in the background) and assert.
  example_web_server_render:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - name: Set up melos
        shell: bash
        run: |
          dart pub global activate melos
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      - name: Start the render server
        run: |
          mkdir -p "$RUNNER_TEMP/renders"
          FLUVIE_ENABLE_API=true HOST=127.0.0.1 PORT=8080 \
            API_TOKEN=e2e-render-token \
            CLEANUP_TOKEN=e2e-cleanup-token \
            RENDER_PROJECT="$PWD/examples/gallery" \
            LOCAL_STORAGE_DIR="$RUNNER_TEMP/renders" \
            CORS_ALLOW_ORIGINS="*" \
            VIDEO_SPEC_SCHEMA_PATH="$PWD/packages/fluvie_server/assets/video_spec_schema.json" \
            dart run packages/fluvie_server/bin/fluvie_server.dart &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break; sleep 2; done
          # Fail loudly if the server never came up, instead of letting the render
          # time out later with no signal.
          curl -fsS http://127.0.0.1:8080/healthz >/dev/null
      - run: flutter build web --release --dart-define=FLUVIE_E2E=true --dart-define=FLUVIE_API_URL=http://127.0.0.1:8080 --dart-define=FLUVIE_API_TOKEN=e2e-render-token
        working-directory: examples/web_server_studio
      - name: Render via the server and assert
        env:
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          BUILD_DIR: examples/web_server_studio/build/web
          E2E_TIMEOUT_MS: "360000"
        run: bash tool/web/e2e/run.sh

  # Advisory: render through the desktop GUI under a virtual display.
  example_desktop_render:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg ninja-build libgtk-3-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Set up melos
        shell: bash
        run: |
          dart pub global activate melos
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      - run: flutter config --enable-linux-desktop
      - name: Render through the GUI under xvfb
        working-directory: examples/desktop_studio
        run: xvfb-run -a flutter test integration_test/render_flow_test.dart -d linux

  # Required native Android acceptance: real encode/decode plus an independent
  # FFmpeg pixel/PCM oracle. API35/default matches the locally verified image.
  example_mobile_render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Install the independent media verifier
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify native timing and bounded MP4 metadata editing
        working-directory: examples/mobile_purrfect/android
        run: ./gradlew :fluvie_mobile_encoder:testDebugUnitTest --no-daemon --max-workers=2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Verify native frame reading, render, and decoded media
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          working-directory: examples/mobile_purrfect
          script: |
            mkdir -p ../../build/release-hardening
            flutter test --no-pub --no-uninstall -d emulator-5554 integration_test/native_clip_reader_test.dart integration_test/native_media_acceptance_test.dart > ../../build/release-hardening/android-device.log 2>&1
            cat ../../build/release-hardening/android-device.log
            python3 tool/verify_android_media.py --serial emulator-5554 --output ../../build/release-hardening/android-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-media-acceptance
          path: |
            build/release-hardening/android-*.log
            build/release-hardening/android-artifacts/
            examples/mobile_purrfect/build/fluvie_mobile_encoder/test-results/testDebugUnitTest/
          if-no-files-found: ignore
