name: publish

# Automated publishing to pub.dev via OIDC. Each package is published by pushing
# a package-scoped tag whose version matches that package's pubspec, e.g.:
#
#   git tag fluvie-v0.1.0 && git push origin fluvie-v0.1.0
#
# Enable "Automated publishing from GitHub Actions" on each package's pub.dev
# admin page with the matching tag pattern before the first run.

on:
  push:
    tags:
      - "fluvie-v[0-9]+.[0-9]+.[0-9]+"
      - "fluvie_cli-v[0-9]+.[0-9]+.[0-9]+"
      - "fluvie_lints-v[0-9]+.[0-9]+.[0-9]+"
      - "fluvie_ai-v[0-9]+.[0-9]+.[0-9]+"
      - "fluvie_api-v[0-9]+.[0-9]+.[0-9]+"
      - "fluvie_mcp-v[0-9]+.[0-9]+.[0-9]+"

jobs:
  fluvie:
    if: startsWith(github.ref, 'refs/tags/fluvie-v')
    permissions:
      id-token: write # OIDC token for pub.dev
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/fluvie

  fluvie_cli:
    if: startsWith(github.ref, 'refs/tags/fluvie_cli-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/fluvie_cli

  fluvie_lints:
    if: startsWith(github.ref, 'refs/tags/fluvie_lints-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/fluvie_lints

  fluvie_ai:
    if: startsWith(github.ref, 'refs/tags/fluvie_ai-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/fluvie_ai

  fluvie_api:
    if: startsWith(github.ref, 'refs/tags/fluvie_api-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/fluvie_api

  fluvie_mcp:
    if: startsWith(github.ref, 'refs/tags/fluvie_mcp-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/fluvie_mcp
