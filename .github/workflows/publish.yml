name: publish

# Publish every package to pub.dev when the umbrella release tag is pushed — the
# same `v<version>` tag that builds the images. All packages share one version
# (lockstep), so the tag `v0.1.2` publishes the 0.1.2 pubspec of each package.
#
# For pub.dev's OIDC check to pass, set each package's tag pattern under
# Admin -> Automated publishing to `v{{version}}` (not `{{package}}-v{{version}}`).
# Creating a GitHub Release for the tag (or `git push` of the tag) triggers this.
#
# Jobs run in parallel; that is safe because the inter-package constraints are
# loose (`^0.1.x`), so a dependency only needs SOME already-published version, not
# this release's. If you tighten those constraints, add `needs:` to order them.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  fluvie:
    permissions:
      id-token: write # OIDC token for pub.dev
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/fluvie

  fluvie_cli:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/fluvie_cli

  fluvie_lints:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/fluvie_lints

  fluvie_ai:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/fluvie_ai

  fluvie_api:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/fluvie_api

  fluvie_mcp:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/fluvie_mcp
