name: docs

# Build the documentation site (docs.fluvie.dev) with Astro Starlight and publish
# it to GitHub Pages. Enable Pages with "Source: GitHub Actions" in the repo
# settings, then add the docs.fluvie.dev custom domain (see RELEASE.md).

on:
  push:
    branches: [main]
    paths:
      - documentation/**
      - web/docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/docs/package-lock.json
      - run: npm ci
      - run: npm run build
      # Serve the custom domain from the Pages deploy.
      - run: echo "docs.fluvie.dev" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
