name: images

# Build and push the service container images to the GitHub Container Registry
# (ghcr.io) on a release tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# The images are public and need no token to pull; pushing uses GITHUB_TOKEN.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fluvie-api
            dockerfile: deploy/api.Dockerfile
          - name: fluvie-mcp
            dockerfile: deploy/mcp.Dockerfile
          - name: fluvie-demo
            dockerfile: deploy/demo.Dockerfile
          - name: fluvie-web
            dockerfile: deploy/landing.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
