name: images

# Build and push the service container images to the GitHub Container Registry
# (ghcr.io) on a release tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`,
# then ping each service's Dokploy deploy webhook so it pulls the new image and
# restarts. The images are public and need no token to pull; pushing uses
# GITHUB_TOKEN.
#
# Build and redeploy are one matrix job per service, so the services are
# independent: if one image fails to build, the others still build and redeploy
# (fail-fast is off, and a failed build stops only its own leg). For the redeploy
# to pull the new build, point each Dokploy app at a moving tag (`:latest` or
# `:0.1`), not a pinned `:0.1.0`. A missing webhook secret just skips that
# service's redeploy, so a release never fails on an unset webhook.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fluvie-api
            dockerfile: deploy/api.Dockerfile
            hook: DOKPLOY_WEBHOOK_API
          - name: fluvie-mcp
            dockerfile: deploy/mcp.Dockerfile
            hook: DOKPLOY_WEBHOOK_MCP
          - name: fluvie-demo
            dockerfile: deploy/demo.Dockerfile
            hook: DOKPLOY_WEBHOOK_DEMO
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Ping this service's Dokploy webhook so it pulls the image just pushed and
      # restarts. Skipped (not failed) when the webhook secret is unset; a failed
      # build above stops the leg before this runs, leaving the other services'
      # legs untouched.
      - name: Redeploy ${{ matrix.name }}
        env:
          DOKPLOY_WEBHOOK_API: ${{ secrets.DOKPLOY_WEBHOOK_API }}
          DOKPLOY_WEBHOOK_MCP: ${{ secrets.DOKPLOY_WEBHOOK_MCP }}
          DOKPLOY_WEBHOOK_DEMO: ${{ secrets.DOKPLOY_WEBHOOK_DEMO }}
          HOOK_VAR: ${{ matrix.hook }}
        run: |
          set -euo pipefail
          HOOK="${!HOOK_VAR:-}"
          if [ -z "$HOOK" ]; then
            echo "$HOOK_VAR not set; skipping ${{ matrix.name }} redeploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Pinged the ${{ matrix.name }} redeploy webhook."
